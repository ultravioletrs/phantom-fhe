[package]
name = "phantom-utils"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Minimal cross-cutting support utilities for phantom-fhe."

[features]
default = ["std"]
std = ["rand_core/getrandom"]
serde = []
test-utils = ["dep:rand_chacha"]

[dependencies]
