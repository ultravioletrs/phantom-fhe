[package]
name = "phantom-fhe"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust-native fully homomorphic encryption library (alpha scaffold)."

[features]
default = ["std"]
std = ["phantom-utils/std", "phantom-ring/std", "phantom-lattice/std"]
serde = ["phantom-utils/serde"]

[dependencies]
phantom-bootstrapping = { path = "../phantom-bootstrapping" }
phantom-circuits = { path = "../phantom-circuits" }
phantom-lattice = { path = "../phantom-lattice" }
phantom-multiparty = { path = "../phantom-multiparty" }
phantom-ring = { path = "../phantom-ring" }
phantom-schemes = { path = "../phantom-schemes" }
phantom-utils = { path = "../phantom-utils" }

[dev-dependencies]
rand_chacha = { workspace = true }
rand_core = { workspace = true }
