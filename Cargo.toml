[workspace]
resolver = "2"
members = [
    "crates/phantom-benches",
    "crates/phantom-bootstrapping",
    "crates/phantom-circuits",
    "crates/phantom-examples",
    "crates/phantom-fhe",
    "crates/phantom-lattice",
    "crates/phantom-multiparty",
    "crates/phantom-ring",
    "crates/phantom-schemes",
    "crates/phantom-utils",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ultravioletrs/phantom-fhe"
rust-version = "1.85"

[workspace.dependencies]
proptest = "1"
rand_chacha = "0.3"
rand_core = "0.6"
thiserror = "1"
