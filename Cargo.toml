[workspace]
resolver = "2"
members = [
    "crates/phantom-benches",
    "crates/phantom-bootstrapping",
    "crates/phantom-circuits",
    "crates/phantom-examples",
    "crates/phantom-fhe",
    "crates/phantom-lattice",
    "crates/phantom-multiparty",
    "crates/phantom-ring",
    "crates/phantom-schemes",
    "crates/phantom-utils",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ultravioletrs/phantom-fhe"
rust-version = "1.85"

[workspace.dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "rand_core"] }
proptest = "1"
rand_chacha = "0.3"
rand_core = "0.6"
sha2 = { version = "0.11", default-features = false }
thiserror = "1"
